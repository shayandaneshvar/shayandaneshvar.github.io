name: Build and deploy v2

on:
  push:
    branches: [master]
    paths: [v2-source/**]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: v2-source/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: v2-source

      - name: Build
        run: npm run build
        working-directory: v2-source

      - name: Commit built files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add v2/
          git diff --staged --quiet || (git commit -m "chore: build v2" && git push)
